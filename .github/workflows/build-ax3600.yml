name: Build AX3600

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ax3600.config
      - .github/workflows/build-ax3600.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: nss-edma-rework
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 \
            rsync unzip zlib1g-dev file wget \
            libelf-dev python3-setuptools python3-dev swig time \
            xsltproc zstd libzstd-dev jq

      - name: Configure feeds
        run: |
          cp feeds.conf.default feeds.conf
          echo "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply AX3600 configuration
        run: |
          cp ax3600.config .config
          make defconfig

          grep -E \
            'CONFIG_PACKAGE_(kmod-nf-conntrack-netlink|conntrack|nlbwmon|luci-app-nlbwmon)=' \
            .config

          grep -q '^CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y$' .config
          grep -q '^CONFIG_PACKAGE_nlbwmon=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-nlbwmon=y$' .config

      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete

      - name: Build firmware
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find bin/targets/qualcommax/ipq807x \
            -maxdepth 1 -type f \
            \( -name '*xiaomi_ax3600*' \
               -o -name 'sha256sums' \
               -o -name '*.manifest' \) \
            -exec cp -v {} artifacts/ \;

          ls -lah artifacts

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ax3600-nss-firmware
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
